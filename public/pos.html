<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de venta · Nova Salud</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar" id="topbar"></header>
    <main>
        <h1>Punto de venta</h1>
        <div class="pos">
            <section class="card">
                <h2>Buscar producto</h2>
                <input type="search" id="busqueda" class="crece" style="width:100%" placeholder="Nombre del producto (Enter agrega el primero)" autocomplete="off" autofocus>
                <p class="mini">Atajos: Enter agrega el primer resultado · clic en un producto lo agrega.</p>
                <div id="resultados"></div>
            </section>

            <section class="card">
                <h2>Venta actual</h2>
                <div id="carrito"></div>

                <label>Cliente (opcional)
                    <input type="search" id="buscaCliente" list="listaClientes" placeholder="Buscar por DNI o nombre" autocomplete="off">
                </label>
                <datalist id="listaClientes"></datalist>
                <p class="mini" id="clienteElegido">Venta sin cliente</p>

                <div class="total-linea"><span>Total</span><span id="total">S/ 0.00</span></div>
                <div id="mensaje" class="error oculto" role="alert"></div>
                <button class="grande" id="btnRegistrar" disabled>Registrar venta</button>
                <button class="sec chico" id="btnLimpiar" style="margin-top:.5rem">Vaciar venta</button>

                <div id="comprobante" class="exito oculto"></div>
            </section>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/pos.js"></script>
</body>
</html>
